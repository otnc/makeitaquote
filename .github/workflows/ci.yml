name: ci

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install
      - run: npm run ci
      - run: npm run typecheck
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run check:build

  # @napi-rs/canvas ships a separate musl binary; glibc runners can't catch a
  # broken Alpine install.
  alpine:
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      # A bare Alpine image has no fonts at all, so text measures zero and
      # paints nothing. The tests run with autoFont off — they must not depend
      # on a download — so a font has to come from somewhere. Installing one
      # here is also the realistic case: a container that renders text has
      # fonts in it.
      - run: apk add --no-cache font-noto font-noto-cjk
      - run: npm install
      - run: npm run test
